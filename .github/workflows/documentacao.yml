# Qualidade da documentação e das configurações: Markdown, links,
# workflows e compose.yaml. Como rodar localmente: docs/DEVELOPMENT.md §4.
name: Documentação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown (markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  links:
    name: Links (lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --no-progress "**/*.md"
          fail: true
          # Lista dos links quebrados no resumo do job.
          jobSummary: true
        env:
          # Conta como requisição autenticada nos links do GitHub (limite maior).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  configuracao:
    name: Workflows e compose.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # Script oficial de download, fixado no commit da v1.7.12.
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: docker compose config
        run: docker compose -f compose.yaml config --quiet
