# Confere, em cada Pull Request, as regras do CONTRIBUTING.md §2–§4 e §7:
# título no formato de commit, nome da branch, vínculo com a Issue e
# autoria do aluno (sem coautoria de ferramentas de IA).
name: Regras do PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  # Para ler os commits do PR (autoria).
  pull-requests: read

concurrency:
  group: regras-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regras:
    name: Regras do CONTRIBUTING
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Título, branch e Issue
        # Os textos do PR chegam por variáveis de ambiente, nunca
        # interpolados no script: um título pode conter qualquer coisa.
        env:
          TITULO: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          CORPO: ${{ github.event.pull_request.body }}
          AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          # PRs de bots (ex.: correções de segurança do Dependabot) seguem o
          # formato deles e não têm Issue; a revisão humana continua valendo.
          if [[ "$AUTOR" == *"[bot]" ]]; then
            echo "PR aberto por $AUTOR: regras de título, branch e Issue não se aplicam."
            exit 0
          fi

          tipos='feat|fix|docs|chore|refactor'
          areas='backend|frontend|ai|contracts|docs|infra|repo'
          falhas=0

          if [[ "$TITULO" =~ ^($tipos)\(($areas)\):\ .+ ]]; then
            echo "Título ok: $TITULO"
          else
            echo "::error title=Título do PR::'$TITULO' não segue 'tipo(area): descrição' (CONTRIBUTING.md §3). Tipos: ${tipos//|/, }. Áreas: ${areas//|/, }. Ex.: feat(backend): login de usuários"
            falhas=1
          fi

          if [[ "$BRANCH" =~ ^($tipos)/($areas)-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Branch ok: $BRANCH"
          else
            echo "::error title=Nome da branch::'$BRANCH' não segue 'tipo/area-numero-descricao' (CONTRIBUTING.md §2), em minúsculas e com hífens. Ex.: feat/backend-12-login"
            falhas=1
          fi

          if grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<< "$CORPO"; then
            echo "Issue vinculada: ok"
          else
            echo "::error title=Issue vinculada::A descrição do PR precisa de 'Closes #<número da Issue>' (CONTRIBUTING.md §4)."
            falhas=1
          fi

          exit "$falhas"

      - name: Autoria do aluno
        # Roda mesmo se o passo anterior falhou, para mostrar tudo de uma vez.
        if: ${{ !cancelled() && !endsWith(github.event.pull_request.user.login, '[bot]') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CORPO: ${{ github.event.pull_request.body }}
        run: |
          # Ferramentas de IA cujos trailers e rodapés não podem aparecer.
          ia='claude|anthropic|copilot|openai|chatgpt|codex|cursor|gemini|devin|aider|windsurf|codeium|tabnine'
          falhas=0

          commits=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[]' | jq -s .)

          bots=$(jq -r '.[] | select(.author.type == "Bot") | "\(.sha[0:7]) (\(.author.login))"' <<< "$commits")
          if [[ -n "$bots" ]]; then
            echo "::error title=Commit de bot::Commits feitos por conta de bot ou agente: $(tr '\n' ' ' <<< "$bots"). Os commits devem ser do aluno (CONTRIBUTING.md §7)."
            falhas=1
          fi

          coautoria=$(jq -r --arg ia "$ia" '.[] | select(.commit.message | test("co-authored-by:[^\n]*(" + $ia + ")"; "i")) | .sha[0:7]' <<< "$commits")
          if [[ -n "$coautoria" ]]; then
            echo "::error title=Coautoria de IA::Commits com trailer Co-authored-by de ferramenta de IA: $(tr '\n' ' ' <<< "$coautoria"). Remova o trailer (git commit --amend ou git rebase -i) e faça push --force-with-lease na sua branch (CONTRIBUTING.md §7)."
            falhas=1
          fi

          rodape=$(jq -r --arg ia "$ia" '.[] | select(.commit.message | test("generated (with|by)[^\n]*(" + $ia + ")"; "i")) | .sha[0:7]' <<< "$commits")
          if [[ -n "$rodape" ]] || grep -qiE "generated (with|by).*($ia)" <<< "$CORPO"; then
            echo "::error title=Rodapé de IA::Commit ou descrição do PR com rodapé gerado pela ferramenta. Declare o uso de IA só com a linha 'Desenvolvimento assistido por IA (<ferramenta>).' em Observações (CONTRIBUTING.md §7). ${rodape:+Commits: $(tr '\n' ' ' <<< "$rodape")}"
            falhas=1
          fi

          if [[ "$falhas" == 0 ]]; then
            echo "Autoria ok: $(jq length <<< "$commits") commit(s) sem coautoria ou rodapé de IA."
          fi
          exit "$falhas"
