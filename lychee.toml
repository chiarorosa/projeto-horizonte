# Verificação de links da documentação (lychee), usada no CI
# (workflow Documentação, versão 0.24.2).

# Links para âncoras (#secao) também são conferidos.
include_fragments = "full"

# Respostas aceitas além de 2xx: 429 é limite de requisições, não link quebrado.
accept = ["200..=299", "429"]

max_retries = 3
timeout = 20

exclude = [
  # Endereços locais dos exemplos de configuração.
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  # O Figma exige login e responde 403 a robôs.
  '^https://www\.figma\.com/',
]

exclude_path = ["context", "node_modules", ".venv"]
